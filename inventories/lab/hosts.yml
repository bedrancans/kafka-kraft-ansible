---
# Lab inventory — podman containers running on WSL.
# Moving to production changes ONLY this file: ansible_host becomes a real IP
# and ansible_port becomes 22. Roles and playbooks stay identical.
all:
  vars:
    ansible_user: ansible
    ansible_ssh_private_key_file: ~/.ssh/kafka_lab
    ansible_python_interpreter: /usr/bin/python3

  children:
    # ---- Kafka brokers + controllers (combined mode) ----
    kafka_brokers:
      hosts:
        kafka-1:
          ansible_host: 127.0.0.1
          ansible_port: 2221
          kafka_node_id: 1
          # Port clients on the host use to reach this broker (EXTERNAL listener)
          kafka_external_advertised_port: 39091
        kafka-2:
          ansible_host: 127.0.0.1
          ansible_port: 2222
          kafka_node_id: 2
          kafka_external_advertised_port: 39092
        kafka-3:
          ansible_host: 127.0.0.1
          ansible_port: 2223
          kafka_node_id: 3
          kafka_external_advertised_port: 39093

    # Combined mode: the controllers are the brokers themselves.
    # To switch to isolated mode, list separate hosts in this group.
    kafka_controllers:
      hosts:
        kafka-1:
        kafka-2:
        kafka-3:

    # ---- Satellite components ----
    # Leaving a group empty means the component is not deployed at all.
    kafka_ui:
      hosts:
        tools-1:
          ansible_host: 127.0.0.1
          ansible_port: 2224

    # Filled in during phase 6
    schema_registry:
      hosts: {}

    # Filled in during phase 7
    kafka_connect:
      hosts: {}

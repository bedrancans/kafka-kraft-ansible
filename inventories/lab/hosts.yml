---
# Lab inventory — WSL üzerindeki podman container'ları.
# Prod'a geçerken SADECE bu dosya değişir: ansible_host gerçek IP,
# ansible_port 22 olur. Roller ve playbook'lar aynı kalır.
all:
  vars:
    ansible_user: ansible
    ansible_ssh_private_key_file: ~/.ssh/kafka_lab
    ansible_python_interpreter: /usr/bin/python3

  children:
    # ---- Kafka broker + controller (combined mode) ----
    kafka_brokers:
      hosts:
        kafka-1:
          ansible_host: 127.0.0.1
          ansible_port: 2221
          kafka_node_id: 1
          # WSL host'undan bu broker'a erişim portu (EXTERNAL listener)
          kafka_external_advertised_port: 39091
        kafka-2:
          ansible_host: 127.0.0.1
          ansible_port: 2222
          kafka_node_id: 2
          kafka_external_advertised_port: 39092
        kafka-3:
          ansible_host: 127.0.0.1
          ansible_port: 2223
          kafka_node_id: 3
          kafka_external_advertised_port: 39093

    # Combined mode: controller'lar broker'ların ta kendisi.
    # Isolated mode'a geçmek istersen bu gruba ayrı hostlar yazman yeterli.
    kafka_controllers:
      hosts:
        kafka-1:
        kafka-2:
        kafka-3:

    # ---- Uydu bileşenler ----
    # Bir grubu boş bırakmak / silmek = o bileşen kurulmaz.
    kafka_ui:
      hosts:
        tools-1:
          ansible_host: 127.0.0.1
          ansible_port: 2224

    # Faz 6'da doldurulacak
    schema_registry:
      hosts: {}

    # Faz 7'de doldurulacak
    kafka_connect:
      hosts: {}

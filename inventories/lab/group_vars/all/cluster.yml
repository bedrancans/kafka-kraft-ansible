---
# Cluster-wide definitions.
#
# RULE 2 (see CONTRIBUTING.md): no role ever hardcodes an address.
# Everything below is derived from the inventory, so adding or removing a
# broker only ever means editing hosts.yml.

kafka_cluster_name: kafka-lab

# --- Ports ---
kafka_internal_port: 9092     # broker-to-broker and satellite components
kafka_external_port: 39092    # EXTERNAL listener port inside the container
kafka_controller_port: 9093   # KRaft quorum, never exposed outside the cluster

# --- Addresses ---
# Container name == inventory name == DNS name (aardvark-dns).
# In production, override this per host with the private IP.
kafka_internal_host: "{{ inventory_hostname }}"
kafka_controller_host: "{{ inventory_hostname }}"

# The address clients outside the cluster connect to
kafka_external_advertised_host: "localhost"

# --- Satellite component ports ---
# These live here rather than inside each component's role because other
# components need them before those roles exist: the UI renders a Schema
# Registry URL as soon as the group has a host, which is what makes adding a
# component a UI restart rather than a cluster change.
schema_registry_port: 8081
kafka_connect_port: 8083

# --- Derived: the bootstrap list every satellite component consumes ---
kafka_bootstrap_servers: >-
  {{ groups['kafka_brokers']
     | map('extract', hostvars, 'kafka_internal_host')
     | map('regex_replace', '$', ':' ~ kafka_internal_port)
     | join(',') }}

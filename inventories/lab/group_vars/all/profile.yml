---
# Lab profile — the ONLY place where lab and production differ.
# Roles read these flags; a role never asks "am I in lab or production?".

kafka_env_profile: lab

# WSL has ~7 GB of RAM in total, so three brokers need small heaps.
# Production sets this to 6g in inventories/prod/group_vars/all/profile.yml.
kafka_heap_size: 512m

# OS tuning is DISABLED in the lab.
# Why: inside a container, sysctl settings (vm.swappiness, vm.max_map_count)
# and THP tweaks are either no-ops or they leak into the host kernel — both
# are wrong. Production sets this to true.
kafka_tune_os: false

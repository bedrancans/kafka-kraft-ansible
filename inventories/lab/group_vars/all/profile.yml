---
# Lab profili — prod ile farkların TEK toplandığı yer.
# Roller bu bayrakları okur; rol içinde "lab mı prod mu" sorgusu yapılmaz.

kafka_env_profile: lab

# WSL'de toplam 7 GB RAM var; 3 broker sığsın diye küçük heap.
# Prod'da inventories/prod/group_vars/all/profile.yml içinde 6g olur.
kafka_heap_size: 512m

# OS tuning'i lab'da KAPALI.
# Neden: container'da sysctl (vm.swappiness, vm.max_map_count) ve THP
# ayarları ya no-op olur ya da WSL host çekirdeğini etkiler — ikisi de
# istenmeyen davranış. Prod'da true.
kafka_tune_os: false

---
# Deploys every component. Each play is scoped to one inventory group and
# carries its own tag, so a single component can be deployed on its own:
#
#   ansible-playbook playbooks/site.yml --tags kafka_ui
#
# If a group has no hosts the play is skipped, which is how a component stays
# out of the deployment until its host is added to the inventory.

- name: Base OS preparation
  hosts: all
  become: true
  tags: [common]
  roles:
    - role: common

- name: Java runtime
  hosts: kafka_brokers:kafka_ui:schema_registry:kafka_connect
  become: true
  tags: [java]
  roles:
    - role: java

- name: Kafka brokers and controllers
  hosts: kafka_brokers
  become: true
  tags: [kafka]
  # All at once by default, because forming a quorum for the first time needs
  # a majority of the nodes up together — one at a time would leave the first
  # broker waiting for peers that Ansible has not reached yet.
  #
  # On a cluster that already exists this is the wrong default: a config
  # change would restart every broker at the same moment. Apply those with
  #   -e kafka_serial=1
  # or through playbooks/rolling-restart.yml.
  serial: "{{ kafka_serial | default('100%') }}"
  roles:
    - role: kafka

# Runs on one broker, after the cluster exists and before the components that
# need these topics. Creating them here rather than letting each client create
# its own is the difference between settings that were chosen and settings
# that happened to come out right.
- name: Declared topics
  hosts: kafka_brokers[0]
  become: true
  tags: [kafka_topics]
  roles:
    - role: kafka_topics

- name: Kafka UI
  hosts: kafka_ui
  become: true
  tags: [kafka_ui]
  roles:
    - role: kafka_ui

- name: Schema Registry
  hosts: schema_registry
  become: true
  tags: [schema_registry]
  roles:
    - role: schema_registry

- name: Kafka Connect
  hosts: kafka_connect
  become: true
  tags: [kafka_connect]
  roles:
    - role: kafka_connect

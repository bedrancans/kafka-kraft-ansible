---
# Read-only checks against an existing deployment.
# Every role ships tasks/verify.yml; this playbook only wires them together.

- name: Verify base OS preparation
  hosts: all
  become: true
  tags: [common]
  tasks:
    - name: Run the common role checks
      ansible.builtin.include_role:
        name: common
        tasks_from: verify.yml

- name: Verify the Java runtime
  hosts: kafka_brokers:kafka_ui:schema_registry:kafka_connect
  become: true
  tags: [java]
  tasks:
    # The role checks every version java_majors asks for; following
    # /usr/bin/java would only ever look at the system default.
    - name: Run the java role checks
      ansible.builtin.include_role:
        name: java
        tasks_from: verify.yml

- name: Verify the Kafka cluster
  hosts: kafka_brokers
  become: true
  tags: [kafka]
  tasks:
    - name: Run the kafka role checks
      ansible.builtin.include_role:
        name: kafka
        tasks_from: verify.yml

- name: Verify Kafka UI
  hosts: kafka_ui
  become: true
  tags: [kafka_ui]
  tasks:
    - name: Run the kafka_ui role checks
      ansible.builtin.include_role:
        name: kafka_ui
        tasks_from: verify.yml

- name: Verify Schema Registry
  hosts: schema_registry
  become: true
  tags: [schema_registry]
  tasks:
    - name: Run the schema_registry role checks
      ansible.builtin.include_role:
        name: schema_registry
        tasks_from: verify.yml

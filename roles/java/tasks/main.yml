---
- name: Install the JRE
  ansible.builtin.apt:
    name: "{{ java_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Resolve the JVM path
  ansible.builtin.import_tasks: resolve.yml

- name: Export JAVA_HOME for interactive shells
  ansible.builtin.template:
    src: java.sh.j2
    dest: "{{ java_profile_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Verify the installation
  ansible.builtin.import_tasks: verify.yml

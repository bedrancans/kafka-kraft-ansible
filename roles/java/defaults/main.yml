---
# Major versions to install on this host.
#
# A list, because one host can legitimately need several: on the lab's tools
# node Kafka UI 1.5 is compiled for 25 while Confluent 8.0 supports 21, and
# neither is going to move for the other. Components declare what they need,
# the host installs all of it, and each service is pointed at its own JVM.
java_majors: [21]

# Which one tasks_from: resolve.yml should locate. Callers override it per
# component; on a single-version host the default is the only one there is.
java_required_major: "{{ java_majors | first }}"

# Package name pattern; override only for a non-distribution build.
java_package_template: "openjdk-{{ item }}-jre-headless"

# Debian and Ubuntu install every JVM under here as java-<major>-openjdk-<arch>.
java_jvm_root: /usr/lib/jvm

# Where JAVA_HOME is exported for interactive shells. Points at the first
# version in the list; systemd units get their own from an environment file.
java_profile_path: /etc/profile.d/java.sh

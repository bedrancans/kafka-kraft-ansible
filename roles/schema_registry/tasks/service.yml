---
- name: Install the systemd unit
  ansible.builtin.template:
    src: schema-registry.service.j2
    dest: "/etc/systemd/system/{{ schema_registry_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart schema-registry

- name: Mark the service as installed
  ansible.builtin.set_fact:
    schema_registry_service_installed: true

- name: Enable and start Schema Registry
  ansible.builtin.systemd_service:
    name: "{{ schema_registry_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

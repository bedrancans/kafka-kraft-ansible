---
# vars/main.yml is loaded automatically, vars/required_topics.yml is not.
# The properties template reads the replication factor from the declaration
# so the number is written down once.
- name: Load this role's topic declaration
  ansible.builtin.include_vars:
    file: required_topics.yml

- name: Assert the cluster has brokers to store schemas in
  ansible.builtin.assert:
    that:
      - groups['kafka_brokers'] | default([]) | length > 0
      - kafka_bootstrap_servers | length > 0
    fail_msg: >-
      Schema Registry keeps its schemas in a Kafka topic, so it needs a
      cluster. The kafka_brokers group is empty.
    quiet: true

- name: Resolve the Java runtime for Schema Registry
  ansible.builtin.include_role:
    name: java
    tasks_from: resolve.yml
  vars:
    java_required_major: "{{ schema_registry_java_major }}"

- name: Set the Java home used by the service
  ansible.builtin.set_fact:
    schema_registry_java_home: "{{ java_home }}"

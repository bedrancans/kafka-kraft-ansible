---
- name: Render connect-distributed.properties
  ansible.builtin.template:
    src: connect-distributed.properties.j2
    dest: "{{ kafka_connect_config_dir }}/connect-distributed.properties"
    owner: root
    group: "{{ kafka_connect_group }}"
    mode: "0640"
  notify: Restart kafka-connect

- name: Render the service environment file
  ansible.builtin.template:
    src: kafka-connect.env.j2
    dest: "{{ kafka_connect_config_dir }}/kafka-connect.env"
    owner: root
    group: "{{ kafka_connect_group }}"
    mode: "0640"
  notify: Restart kafka-connect

---
# ===========================================================================
# Distribution
# ===========================================================================
# kafbat/kafka-ui is the maintained continuation of provectus/kafka-ui, which
# was archived. The release is a single Spring Boot fat jar, so this component
# follows the same tarball-and-systemd model as the broker: no container
# runtime is involved anywhere in this repository.
kafka_ui_version: "1.5.0"
kafka_ui_repo: "kafbat/kafka-ui"
kafka_ui_artifact: "api-v{{ kafka_ui_version }}.jar"
kafka_ui_download_url: >-
  https://github.com/{{ kafka_ui_repo }}/releases/download/v{{ kafka_ui_version }}/{{ kafka_ui_artifact }}

# Reported by the GitHub releases API as the asset digest.
# Note the difference from the broker: Apache publishes a checksum file signed
# by the release manager, while this one is computed by GitHub from the
# uploaded asset. It protects against a corrupted or tampered download, not
# against a compromised upload.
kafka_ui_artifact_sha256: "8bebff7b21ddb084b5b647e271136f7d97f46da6c7bc70f9cd47775dfbd3c10e"

# ===========================================================================
# Paths and identity
# ===========================================================================
# Its own service account, not the kafka one: a component should not inherit
# read access to the broker's data directory just by being on the same host.
kafka_ui_user: kafka-ui
kafka_ui_group: kafka-ui

kafka_ui_base_dir: /opt/kafka-ui
kafka_ui_versioned_jar: "{{ kafka_ui_base_dir }}/api-{{ kafka_ui_version }}.jar"
kafka_ui_current_jar: "{{ kafka_ui_base_dir }}/api.jar"   # symlink
kafka_ui_config_dir: /etc/kafka-ui
kafka_ui_home_dir: /var/lib/kafka-ui
kafka_ui_log_dir: /var/log/kafka-ui

# ===========================================================================
# Runtime
# ===========================================================================
kafka_ui_port: 8080
# 0.0.0.0 so the port published by the lab container is reachable.
# In production, bind to the interface that is actually meant to serve it.
kafka_ui_bind_address: "0.0.0.0"

# The name shown in the UI's cluster selector.
kafka_ui_cluster_display_name: "{{ kafka_cluster_name | default('kafka') }}"

# Kafka UI can write its own configuration when this is on. It is off here on
# purpose: the configuration is generated by this role, and a change made in
# the browser would be silently reverted by the next Ansible run.
kafka_ui_dynamic_config_enabled: false

# There is no authentication in front of the UI yet. Phase 8 adds it together
# with SASL and TLS; until then the port must not be exposed beyond the lab.
kafka_ui_auth_enabled: false

# Kafka UI 1.5 is compiled for Java 25 (class file version 69). Running it on
# 21 fails at startup with UnsupportedClassVersionError, so the version is
# stated here and the JVM path is resolved from it.
kafka_ui_java_major: 25

kafka_ui_heap_size: "512m"
kafka_ui_jvm_opts: >-
  -XX:+UseG1GC
  -Djava.awt.headless=true

# ===========================================================================
# systemd
# ===========================================================================
kafka_ui_service_name: kafka-ui
kafka_ui_service_restart_sec: 10
kafka_ui_service_stop_timeout_sec: 30
kafka_ui_service_nofile_limit: 16384

# ===========================================================================
# Verification
# ===========================================================================
# A Spring Boot application of this size takes a while to become healthy.
kafka_ui_verify_timeout_sec: 180

# ===========================================================================
# Cluster credentials
# ===========================================================================
# Follows kafka_client_security_enabled from group_vars, so this component is
# reconfigured by the same profile switch that moves the brokers. Clients need
# only the truststore: mutual TLS is used between brokers and the controller
# quorum, not for client connections.
kafka_ui_security_enabled: "{{ kafka_client_security_enabled | default(false) }}"
kafka_ui_sasl_mechanism: "{{ kafka_sasl_mechanism | default('SCRAM-SHA-512') }}"
kafka_ui_sasl_username: kafka-ui
kafka_ui_sasl_password: "{{ kafka_service_passwords[kafka_ui_sasl_username] | default('') }}"
kafka_ui_truststore: /etc/kafka-tls/ca.crt

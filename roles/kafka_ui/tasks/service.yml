---
- name: Install the systemd unit
  ansible.builtin.template:
    src: kafka-ui.service.j2
    dest: "/etc/systemd/system/{{ kafka_ui_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart kafka-ui

- name: Mark the service as installed
  ansible.builtin.set_fact:
    kafka_ui_service_installed: true

- name: Enable and start Kafka UI
  ansible.builtin.systemd_service:
    name: "{{ kafka_ui_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

---
- name: Create the kafka-ui group
  ansible.builtin.group:
    name: "{{ kafka_ui_group }}"
    system: true
    state: present

- name: Create the kafka-ui user
  ansible.builtin.user:
    name: "{{ kafka_ui_user }}"
    group: "{{ kafka_ui_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ kafka_ui_home_dir }}"
    create_home: false
    state: present

- name: Create the kafka-ui directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ kafka_ui_user }}"
    group: "{{ kafka_ui_group }}"
    mode: "0755"
  loop:
    - "{{ kafka_ui_base_dir }}"
    - "{{ kafka_ui_config_dir }}"
    - "{{ kafka_ui_home_dir }}"
    - "{{ kafka_ui_log_dir }}"

# The jar keeps its version in the filename, exactly like the broker keeps its
# version in the directory name, so an upgrade is a download plus a symlink
# flip and a rollback is the flip in reverse.
- name: Download the Kafka UI jar
  ansible.builtin.get_url:
    url: "{{ kafka_ui_download_url }}"
    dest: "{{ kafka_ui_versioned_jar }}"
    checksum: "sha256:{{ kafka_ui_artifact_sha256 }}"
    owner: "{{ kafka_ui_user }}"
    group: "{{ kafka_ui_group }}"
    mode: "0644"
    timeout: 300

- name: Point the stable jar path at this version
  ansible.builtin.file:
    src: "{{ kafka_ui_versioned_jar }}"
    dest: "{{ kafka_ui_current_jar }}"
    state: link
    owner: "{{ kafka_ui_user }}"
    group: "{{ kafka_ui_group }}"
  notify: Restart kafka-ui

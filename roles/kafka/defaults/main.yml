---
# ===========================================================================
# Distribution
# ===========================================================================
# The version is pinned on purpose. "Install the latest" makes a playbook
# that works today and installs something else tomorrow.
# Upgrading is a deliberate edit here plus playbooks/upgrade.yml.
# Defaults to the cluster-wide distribution so the broker and Kafka Connect
# cannot drift apart; playbooks/upgrade.yml overrides it with -e.
kafka_version: "{{ kafka_distribution_version | default('4.3.1') }}"
kafka_scala_version: "{{ kafka_distribution_scala_version | default('2.13') }}"

kafka_mirror: "https://downloads.apache.org/kafka"
kafka_archive_name: "kafka_{{ kafka_scala_version }}-{{ kafka_version }}.tgz"
kafka_download_url: "{{ kafka_mirror }}/{{ kafka_version }}/{{ kafka_archive_name }}"

# Published next to the archive as <archive>.sha512.
# get_url refuses to install anything that does not match, which is what
# turns "downloaded a file" into "downloaded the right file".
kafka_archive_sha512: "{{ kafka_distribution_sha512 }}"

# ===========================================================================
# Paths and identity
# ===========================================================================
kafka_user: kafka
kafka_group: kafka

kafka_base_dir: /opt
# Every version lands in its own directory and /opt/kafka is a symlink to the
# active one. Upgrade and rollback then become a single symlink flip.
kafka_versioned_dir: "{{ kafka_base_dir }}/kafka-{{ kafka_version }}"
kafka_install_dir: "{{ kafka_base_dir }}/kafka"

kafka_config_dir: /etc/kafka
# The service account's home. It must NOT be log.dirs: anything that writes
# into a user's home (Ansible's own ~/.ansible/tmp, for one) would land in the
# data directory, and Kafka refuses to start when log.dirs contains a
# directory that is not a topic partition.
kafka_home_dir: /var/lib/kafka
kafka_data_dir: "{{ kafka_home_dir }}/data"  # log.dirs — the actual messages
kafka_app_log_dir: /var/log/kafka            # log4j output of the broker itself
kafka_download_dir: /var/cache/kafka

# ===========================================================================
# Topology
# ===========================================================================
# Combined mode: the same node is both broker and controller.
# For isolated mode set this to "broker" or "controller" per group.
kafka_process_roles: "broker,controller"

# kafka_node_id is intentionally NOT defaulted: every node must define its own
# in the inventory, and preflight asserts it is unique across the cluster.

# ===========================================================================
# Listeners
# ===========================================================================
# Declared as a list rather than built into the template, because migrating to
# TLS is not a matter of changing a protocol in place: during a rolling
# restart half the brokers would speak PLAINTEXT and half SASL_SSL on the same
# port, and they would stop being able to talk to each other. The migration is
# instead "add a listener, roll, switch to it, roll, remove the old one, roll"
# — three edits to this list, each followed by playbooks/rolling-restart.yml.
#
# Fields:
#   name      the listener name Kafka uses internally
#   port      what it binds
#   protocol  PLAINTEXT | SSL | SASL_PLAINTEXT | SASL_SSL
#   advertise internal | external | none
#             internal advertises the node's own hostname, external advertises
#             whatever a client outside the cluster reaches it as, and none is
#             for the controller listener, which Kafka refuses to advertise
#   roles     which process roles open it
kafka_listeners:
  - name: INTERNAL
    port: "{{ kafka_internal_port }}"
    protocol: PLAINTEXT
    advertise: internal
    roles: [broker]
  - name: EXTERNAL
    port: "{{ kafka_external_port }}"
    protocol: PLAINTEXT
    advertise: external
    roles: [broker]
  - name: CONTROLLER
    port: "{{ kafka_controller_port }}"
    protocol: PLAINTEXT
    advertise: none
    roles: [controller]

# Which listener carries broker-to-broker traffic, and which one the quorum
# uses. Switching either is a step of the migration, not a rewrite.
kafka_inter_broker_listener: INTERNAL
kafka_controller_listener_names: [CONTROLLER]

# ===========================================================================
# Security
# ===========================================================================
# Off by default: a cluster that cannot be brought up without certificates is
# a cluster nobody experiments with. Turning it on renders the TLS and SASL
# settings; which listeners actually use them is decided by their protocol
# above.
kafka_security_enabled: false

kafka_sasl_mechanism: SCRAM-SHA-512

# This broker's own SCRAM credential, picked out of the vaulted map by
# hostname. Per-broker rather than shared: a leaked credential then identifies
# which host leaked it and can be rotated on its own.
kafka_broker_password: "{{ kafka_broker_passwords[inventory_hostname] | default('') }}"

# Written by the tls role.
kafka_tls_dir: "{{ kafka_config_dir }}/tls"
kafka_tls_keystore: "{{ kafka_tls_dir }}/server.pem"
kafka_tls_truststore: "{{ kafka_tls_dir }}/ca.crt"

# Brokers authenticate to the controller quorum with their certificate, so the
# principal there is the certificate subject rather than a SASL user.
# ssl.principal.mapping.rules turns "CN=kafka-1" into "kafka-1".
kafka_ssl_principal_mapping: "RULE:^CN=(.*?),?.*$/$1/,DEFAULT"

# Accounts exempt from authorization. The brokers themselves have to be here
# or they cannot manage the cluster once the authorizer is on.
kafka_super_users: >-
  {{ ['User:admin'] + (groups['kafka_brokers'] | map('regex_replace', '^', 'User:') | list) }}

# Every account the cluster needs, assembled from the vault. Brokers first
# because they must exist before the inter-broker listener starts using SASL.
kafka_scram_users: >-
  {{ (kafka_broker_passwords | default({}) | dict2items)
     + [{'key': 'admin', 'value': kafka_admin_password | default('')}]
     + (kafka_service_passwords | default({}) | dict2items)
     + [{'key': 'client', 'value': kafka_client_password | default('')}] }}

# The authorizer is separate from authentication on purpose: turning it on
# before the ACLs exist locks everyone out, so it is the last switch thrown.
kafka_authorizer_enabled: false
kafka_authorizer_class: org.apache.kafka.metadata.authorizer.StandardAuthorizer
# When false, anything without a matching ACL is denied. Left false because
# the alternative is an authorizer that authorizes nothing.
kafka_allow_everyone_if_no_acl_found: false

# ===========================================================================
# Cluster-wide durability
# ===========================================================================
# Three replicas, two of which must acknowledge a write. With acks=all this
# means the cluster survives losing one broker without losing data — and
# stops accepting writes when it loses two. That is the deliberate trade-off.
kafka_default_replication_factor: 3
kafka_min_insync_replicas: 2
kafka_num_partitions: 3

# Kafka's own internal topics need the same durability as user data.
kafka_offsets_topic_replication_factor: 3
kafka_transaction_state_log_replication_factor: 3
kafka_transaction_state_log_min_isr: 2

# Creating topics by accident from a typo in a client is a common way to end
# up with single-replica topics in production.
kafka_auto_create_topics_enable: false

# ===========================================================================
# Retention and storage
# ===========================================================================
kafka_log_retention_hours: 168          # 7 days
kafka_log_segment_bytes: 1073741824     # 1 GiB
kafka_log_retention_check_interval_ms: 300000

# ===========================================================================
# Threading and sockets
# ===========================================================================
kafka_num_network_threads: 3
kafka_num_io_threads: 8
kafka_socket_send_buffer_bytes: 102400
kafka_socket_receive_buffer_bytes: 102400
kafka_socket_request_max_bytes: 104857600

# ===========================================================================
# JVM
# ===========================================================================
# Kafka 4.x is supported on Java 17 and 21. Other components on the same host
# may need a different major version, so the broker states the one it wants
# and the JVM path is resolved from it.
kafka_java_major: 21

# The environment profile overrides this
# (inventories/*/group_vars/all/profile.yml): 512m in the lab, 6g in
# production. The value here is only the standalone fallback.
# Kafka reads most data from the page cache, so an oversized heap steals
# memory from the OS and lengthens GC pauses.
kafka_heap_size: "1g"

kafka_jvm_opts: >-
  -XX:+UseG1GC
  -XX:MaxGCPauseMillis=20
  -XX:InitiatingHeapOccupancyPercent=35
  -XX:+ExplicitGCInvokesConcurrent
  -Djava.awt.headless=true

# ===========================================================================
# systemd
# ===========================================================================
kafka_service_name: kafka
kafka_service_restart_sec: 5
# Kafka flushes and closes its log segments on shutdown; killing it early
# forces a slow recovery scan on the next start.
kafka_service_stop_timeout_sec: 180
kafka_service_nofile_limit: 100000

# ===========================================================================
# Verification
# ===========================================================================
# How long tasks/verify.yml waits for the broker to answer.
kafka_verify_timeout_sec: 60

# How long tasks/wait_healthy.yml waits for a restarted broker to rejoin and
# for every partition to regain a full ISR. Generous on purpose: a broker with
# a large log directory can take minutes to catch up, and giving up early
# during a rolling restart is worse than waiting.
kafka_health_timeout_sec: 300

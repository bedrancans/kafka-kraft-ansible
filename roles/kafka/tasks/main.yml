---
# Order matters:
#   preflight  fails before anything is touched
#   user       the account and directories the rest writes into
#   install    binaries on disk
#   configure  server.properties, which format then reads
#   format     one-time, guarded, destructive if repeated
#   service    unit file, enable, start
#   verify     the broker actually answers
- name: Run preflight assertions
  ansible.builtin.import_tasks: preflight.yml

- name: Create the service account and directories
  ansible.builtin.import_tasks: user.yml

- name: Install the distribution
  ansible.builtin.import_tasks: install.yml

- name: Render the configuration
  ansible.builtin.import_tasks: configure.yml

- name: Format the KRaft storage
  ansible.builtin.import_tasks: format.yml

- name: Install and start the service
  ansible.builtin.import_tasks: service.yml

- name: Verify the broker
  ansible.builtin.import_tasks: verify.yml

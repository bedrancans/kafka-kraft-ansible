---
- name: Install the systemd unit
  ansible.builtin.template:
    src: kafka.service.j2
    dest: "/etc/systemd/system/{{ kafka_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart kafka

# The restart handler is guarded by this fact. Without it, a first run would
# try to restart a service that systemd does not know about yet.
- name: Mark the service as installed
  ansible.builtin.set_fact:
    kafka_service_installed: true

- name: Enable and start Kafka
  ansible.builtin.systemd_service:
    name: "{{ kafka_service_name }}"
    enabled: true
    state: started
    daemon_reload: true

---
# The tools node runs two components with different JDK requirements:
#   Kafka UI 1.5      compiled for 25
#   Schema Registry   Confluent 8.0, supported on 21
#
# The lab keeps this in inventories/lab/host_vars/tools-1.yml. The scenario
# needs its own copy because its hosts are named differently — container names
# are global per user, and sharing them with the lab meant molecule's destroy
# step took the lab with it.
java_majors: [21, 25]
